<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PantryChef{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">🍲 PantryChef</a>
  <nav>
    <a href="{{ url_for('pantry') }}" class="{{ 'active' if request.path == url_for('pantry') }}">Pantry</a>
    <a href="{{ url_for('matches') }}" class="{{ 'active' if request.path == url_for('matches') }}">What can I make?</a>
    <a href="{{ url_for('plan_week') }}" class="{{ 'active' if request.path == url_for('plan_week') }}">Plan a week</a>
    <a href="{{ url_for('list_recipes') }}" class="{{ 'active' if request.path.startswith('/recipes') }}">Recipes</a>
    <a href="{{ url_for('import_recipe') }}" class="{{ 'active' if request.path == url_for('import_recipe') }}">Import PDF</a>
  </nav>
</header>
<main class="content">
{% block content %}{% endblock %}
</main>
<footer class="site-footer no-print">Built by Geraldine Kelly, with AI assistance</footer>
</body>
</html>
